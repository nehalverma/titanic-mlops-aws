version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - python -m pip install --upgrade pip
      - pip install sagemaker

  build:
    commands:
      - echo "Updating SageMaker Pipeline..."
      - python pipeline.py
      - echo "Starting SageMaker Pipeline..."
      - aws sagemaker start-pipeline-execution --pipeline-name "$SAGEMAKER_PIPELINE_NAME" --pipeline-execution-display-name "GitHub-CI-CD-Run" --region us-east-1
